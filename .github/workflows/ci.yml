name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # n8n-workflow pulls a native transitive dependency that is not needed to
      # build or lint the node (it is provided by the n8n host at runtime).
      - run: npm install --ignore-scripts
      # The node is generated from the recorded API surface in spec/. If the
      # two have drifted, the committed sources are stale: re-run
      # `npm run api:sync` (needs a Warmbly checkout) and `npm run generate`.
      - run: npm run generate
      # Scoped to the generated sources: an incidental lockfile touch from
      # `npm install` is not node drift.
      - run: git diff --exit-code -- nodes spec
      - run: npm run lint
      - run: npm run build
      # Unit tests only; the e2e suite (npm run test:e2e) needs a running
      # Warmbly server, so it runs locally / in a dedicated integration job.
      - run: npm test
